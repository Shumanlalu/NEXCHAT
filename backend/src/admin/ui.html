<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>NEXCHAT Super Admin</title>
<style>
:root{
  --bg:#0b1020; --bg-soft:#111830; --panel:#141c35; --panel-2:#1a2442;
  --border:#263354; --text:#e8edf9; --muted:#93a1bf; --faint:#64739a;
  --accent:#6d8cff; --accent-2:#8b5cf6; --success:#2dd4a7; --warning:#f3b34c; --danger:#ff6b81;
  --shadow:0 18px 60px rgba(0,0,0,.35); --radius:14px; --sidebar:248px;
}
html[data-theme="light"]{
  --bg:#f4f6fb; --bg-soft:#eef2f9; --panel:#ffffff; --panel-2:#f7f9fe;
  --border:#dfe5f0; --text:#172033; --muted:#5b6880; --faint:#8490a8;
  --accent:#3157e8; --accent-2:#7c3aed; --success:#078a70; --warning:#a86400; --danger:#c9314c;
  --shadow:0 18px 60px rgba(24,38,74,.12);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.boot,.page-loading{padding:40px;color:var(--muted)}
.boot{display:grid;place-items:center;min-height:100vh}
.spinner{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle;margin-right:10px}
@keyframes spin{to{transform:rotate(360deg)}}
.layout{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar);flex:0 0 var(--sidebar);background:var(--bg-soft);border-right:1px solid var(--border);padding:18px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;font-weight:800;letter-spacing:.4px}
.brand .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#fff;font-size:15px;box-shadow:0 8px 24px rgba(109,140,255,.35)}
.brand small{display:block;font-size:10px;color:var(--muted);font-weight:600;letter-spacing:1.4px;text-transform:uppercase}
.nav-label{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--faint);padding:14px 10px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;color:var(--muted);font-weight:600;border:1px solid transparent}
.nav-item:hover{background:var(--panel);color:var(--text);text-decoration:none}
.nav-item.active{background:linear-gradient(135deg,rgba(109,140,255,.18),rgba(139,92,246,.14));border-color:rgba(109,140,255,.35);color:var(--text)}
.nav-item .ico{width:18px;text-align:center;opacity:.9}
.sidebar-foot{margin-top:auto;padding:12px 8px;color:var(--faint);font-size:11px;line-height:1.6}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 26px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bg) 86%,transparent);position:sticky;top:0;z-index:20;backdrop-filter:blur(14px)}
.topbar h1{font-size:19px;margin:0;line-height:1.2}
.topbar .sub{color:var(--muted);font-size:12px;margin-top:2px}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--border);background:var(--panel);color:var(--text);padding:8px 12px;border-radius:9px;font-weight:650;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);text-decoration:none}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff}
.btn.danger{border-color:rgba(255,107,129,.4);color:var(--danger)}
.btn.ghost{background:transparent}
.btn.small{padding:5px 9px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:9px;border:1px solid var(--border);background:var(--panel);cursor:pointer}
.content{padding:24px 26px 60px;max-width:1500px;width:100%;margin:0 auto}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.panel h2,.panel h3{margin:0 0 4px;font-size:15px}
.panel .hint{color:var(--muted);font-size:12px;margin:0 0 14px}
.grid{display:grid;gap:16px}
.grid.cards{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;min-width:0}
.card .label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.9px;font-weight:700}
.card .value{font-size:27px;font-weight:800;margin:8px 0 2px;letter-spacing:-.5px;overflow-wrap:anywhere}
.card .sub{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.card .delta{font-size:12px;font-weight:700;margin-left:6px}
.up{color:var(--success)} .down{color:var(--danger)} .flat{color:var(--muted)}
.status-strip{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--panel)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--faint)}
.dot.ok{background:var(--success);box-shadow:0 0 0 4px rgba(45,212,167,.12)}
.dot.bad{background:var(--danger);box-shadow:0 0 0 4px rgba(255,107,129,.12)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid var(--border);color:var(--muted);background:var(--panel-2);white-space:nowrap}
.pill.ok{color:var(--success);border-color:rgba(45,212,167,.35);background:rgba(45,212,167,.08)}
.pill.warn{color:var(--warning);border-color:rgba(243,179,76,.35);background:rgba(243,179,76,.08)}
.pill.bad{color:var(--danger);border-color:rgba(255,107,129,.35);background:rgba(255,107,129,.08)}
.pill.info{color:var(--accent);border-color:rgba(109,140,255,.35);background:rgba(109,140,255,.08)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--faint);font-size:10px;font-family:inherit}
.chart .grid-line{stroke:var(--border);stroke-width:1;opacity:.55}
.chart .bar{fill:var(--accent);opacity:.88}
.chart .bar.alt{fill:var(--success)}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.chart .line.alt{stroke:var(--success)}
.chart .area{fill:var(--accent);opacity:.10}
.chart .dot{fill:var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin-top:6px}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);vertical-align:middle;font-size:13px}
th{color:var(--muted);font-size:10px;letter-spacing:.9px;text-transform:uppercase;background:var(--panel-2);position:sticky;top:0;z-index:1}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--panel-2)}
td .name{font-weight:700}
td .muted,.muted{color:var(--muted)}
td .tiny,.tiny{font-size:11px;color:var(--faint)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.input,select,textarea{background:var(--bg-soft);border:1px solid var(--border);border-radius:9px;padding:9px 11px;min-width:0;color:var(--text)}
textarea{width:100%;min-height:88px;resize:vertical}
.input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(109,140,255,.15)}
label.field{display:block;margin-bottom:12px}
label.field>span{display:block;font-size:12px;color:var(--muted);font-weight:650;margin-bottom:5px}
.check{display:flex;align-items:flex-start;gap:9px;padding:10px;border:1px solid var(--border);border-radius:9px;background:var(--bg-soft);margin-bottom:10px}
.check input{margin-top:3px}
.check b{display:block;font-size:13px}
.check small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.stack{display:grid;gap:10px}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;font-size:12px;word-break:break-all}
pre{background:var(--bg-soft);border:1px solid var(--border);border-radius:9px;padding:12px;overflow:auto;font-size:11px;line-height:1.5;max-height:320px;white-space:pre-wrap;word-break:break-word}
.bar-list{display:grid;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(90px,1.2fr) 2.6fr 48px;gap:10px;align-items:center;font-size:12px}
.bar-track{height:8px;border-radius:999px;background:var(--bg-soft);overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.bar-fill.green{background:linear-gradient(90deg,var(--success),#7ee7c7)}
.bar-fill.red{background:linear-gradient(90deg,var(--danger),#ff9eac)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;color:var(--muted);font-size:12px}
.empty{padding:26px;text-align:center;color:var(--muted)}
.error-box{border:1px solid rgba(255,107,129,.4);background:rgba(255,107,129,.08);color:var(--danger);padding:12px 14px;border-radius:10px;margin-bottom:14px;font-size:13px}
.auth-wrap{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr}
.auth-brand{background:radial-gradient(circle at 18% 18%,rgba(109,140,255,.28),transparent 45%),radial-gradient(circle at 80% 75%,rgba(139,92,246,.22),transparent 50%),var(--bg-soft);padding:48px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--border)}
.auth-brand h1{font-size:40px;line-height:1.08;letter-spacing:-1.5px;margin:18px 0 12px;max-width:520px}
.auth-brand p{color:var(--muted);max-width:480px;line-height:1.65}
.auth-brand ul{list-style:none;padding:0;margin:26px 0 0;display:grid;gap:10px;color:var(--muted);font-size:13px}
.auth-brand li:before{content:"✓";color:var(--success);font-weight:800;margin-right:8px}
.auth-form{display:flex;align-items:center;justify-content:center;padding:36px}
.auth-card{width:100%;max-width:420px}
.auth-card h2{margin:0 0 6px;font-size:24px;letter-spacing:-.5px}
.auth-card .hint{color:var(--muted);margin:0 0 22px;font-size:13px}
.auth-card .input{width:100%}
.auth-card .btn{width:100%;padding:11px;margin-top:4px}
.auth-form{position:relative}
.auth-theme{position:absolute;top:18px;right:18px;z-index:2}
.password-field{position:relative;display:block}
.password-field .input{padding-right:68px}
.password-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--accent);font-size:12px;font-weight:750;padding:5px 7px;border-radius:6px;cursor:pointer}
.password-toggle:hover{background:rgba(109,140,255,.12)}
.auth-links{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:12px 0 4px;font-size:12px}
.auth-links button{border:0;background:transparent;color:var(--accent);font-weight:700;padding:0;cursor:pointer}
.auth-links button:hover{text-decoration:underline}
.auth-remember{margin:8px 0 12px}
.auth-remember input{width:15px;height:15px;margin-top:2px;accent-color:var(--accent)}
@keyframes authFade{from{opacity:0}to{opacity:1}}
@keyframes authSlide{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes authBrand{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.auth-wrap{animation:authFade .3s ease both}
.auth-brand{animation:authBrand .55s cubic-bezier(.2,.8,.2,1) both}
.auth-card{animation:authSlide .5s .08s cubic-bezier(.2,.8,.2,1) both}
.auth-card form{animation:authSlide .5s .14s cubic-bezier(.2,.8,.2,1) both}
@media(prefers-reduced-motion:reduce){.auth-wrap,.auth-brand,.auth-card,.auth-card form{animation:none}}
.secret-box{border:1px dashed var(--accent);background:rgba(109,140,255,.08);padding:14px;border-radius:10px;margin:12px 0}
.modal-backdrop{position:fixed;inset:0;background:rgba(4,8,20,.68);backdrop-filter:blur(3px);z-index:100;display:grid;place-items:center;padding:18px}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);width:min(720px,100%);max-height:90vh;overflow:auto;padding:20px}
.modal h3{margin:0 0 4px;font-size:18px}
.modal .modal-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.modal .close{margin-left:auto}
.toast{position:fixed;right:18px;bottom:18px;z-index:200;display:grid;gap:8px}
.toast div{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--accent);padding:11px 14px;border-radius:9px;box-shadow:var(--shadow);max-width:360px;font-size:13px}
.toast div.bad{border-left-color:var(--danger)}
.toast div.ok{border-left-color:var(--success)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:7px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.notice{padding:11px 13px;border-radius:9px;border:1px solid var(--border);background:var(--panel-2);color:var(--muted);font-size:12px;margin-bottom:14px}
.notice.warn{border-color:rgba(243,179,76,.4);background:rgba(243,179,76,.08);color:var(--warning)}
.notice.bad{border-color:rgba(255,107,129,.4);background:rgba(255,107,129,.08);color:var(--danger)}
.hamburger{display:none}
.sidebar-backdrop{display:none}
@media(max-width:1060px){.grid.two,.grid.three{grid-template-columns:1fr}.auth-wrap{grid-template-columns:1fr}.auth-brand{display:none}}
@media(max-width:900px){
  .sidebar{position:fixed;left:0;top:0;z-index:50;transform:translateX(-102%);transition:transform .2s ease;box-shadow:var(--shadow)}
  body.nav-open .sidebar{transform:none}
  body.nav-open .sidebar-backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
  .hamburger{display:grid}
  .topbar{padding:12px 16px}
  .content{padding:16px 14px 60px}
  .topbar h1{font-size:17px}
}
@media(max-width:620px){
  .grid.cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card .value{font-size:22px}
  .auth-form{padding:22px}
  .kv{grid-template-columns:1fr}
  .bar-row{grid-template-columns:90px 1fr 40px}
}
@media print{
  body{background:#fff;color:#000}
  .sidebar,.topbar,.sidebar-backdrop,.toast,.no-print{display:none!important}
  .content{padding:0;max-width:none}
  .panel,.card{border-color:#ccc;box-shadow:none;background:#fff}
  .table-wrap{overflow:visible;border-color:#999}
  th{background:#eee;color:#000}
  a{color:#000}
}
</style>
</head>
<body>
<div id="app"><div class="boot"><span class="spinner"></span>Loading NEXCHAT Admin…</div></div>
<div id="modal-root"></div>
<div id="toast" class="toast" aria-live="polite"></div>
<div class="sidebar-backdrop" id="sidebar-backdrop"></div>
<script nonce="__CSP_NONCE__">
'use strict';
const state = {
  admin: null, csrf: null, route: 'overview', range: '30d',
  userQuery: '', userStatus: 'active', userSort: 'created_desc', userPage: 1,
  callsStatus: '', callsPage: 1, auditPage: 1, auditAction: '',
  monitoring: null, editingAnnouncement: null, boot: null, callCache: {}, reset: null
};
const PERMS = {
  super_admin: ['*'],
  admin: ['dashboard.read','users.read','users.write','calls.read','monitoring.read','config.read','config.write','announcements.write','audit.read','reports.export'],
  analyst: ['dashboard.read','users.read','calls.read','monitoring.read','config.read','reports.export'],
  support: ['dashboard.read','users.read','users.write','calls.read','monitoring.read']
};
function can(permission){
  const list = PERMS[state.admin && state.admin.role] || [];
  return list.includes('*') || list.includes(permission);
}
const $ = (selector, root) => (root || document).querySelector(selector);
const $$ = (selector, root) => Array.from((root || document).querySelectorAll(selector));
function h(value){
  return String(value === null || value === undefined ? '' : value)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function fmtNum(value){
  const n = Number(value);
  if (!Number.isFinite(n)) return '—';
  if (Math.abs(n) >= 1000000) return (n/1000000).toFixed(n % 1000000 === 0 ? 0 : 1) + 'M';
  if (Math.abs(n) >= 10000) return (n/1000).toFixed(1) + 'K';
  return n.toLocaleString();
}
function fmtBytes(value){
  const n = Number(value);
  if (!Number.isFinite(n) || n <= 0) return '—';
  const units = ['B','KB','MB','GB','TB'];
  let size = n, i = 0;
  while (size >= 1024 && i < units.length - 1) { size /= 1024; i++; }
  return size.toFixed(size >= 100 || i === 0 ? 0 : 1) + ' ' + units[i];
}
function fmtAt(value){
  if (!value) return '—';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return '—';
  return date.toLocaleString(undefined, { dateStyle:'medium', timeStyle:'short' });
}
function fmtDay(value){
  if (!value) return '—';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return h(value);
  return date.toLocaleDateString(undefined, { month:'short', day:'numeric' });
}
function fmtDuration(seconds){
  const n = Number(seconds);
  if (!Number.isFinite(n) || n < 0) return '—';
  if (n < 60) return Math.round(n) + 's';
  const m = Math.floor(n/60), s = Math.round(n%60);
  if (m < 60) return m + 'm ' + s + 's';
  const hours = Math.floor(m/60), minutes = m%60;
  return hours + 'h ' + minutes + 'm';
}
function pct(value){
  if (value === null || value === undefined || !Number.isFinite(Number(value))) return '—';
  return Number(value).toFixed(1) + '%';
}
function delta(current, previous){
  const c = Number(current) || 0, p = Number(previous) || 0;
  if (p === 0) return c > 0 ? '<span class="delta up">new</span>' : '';
  const change = Math.round(((c - p) / p) * 1000) / 10;
  const cls = change > 0 ? 'up' : change < 0 ? 'down' : 'flat';
  return '<span class="delta ' + cls + '">' + (change > 0 ? '+' : '') + change + '%</span>';
}
function statusPill(status){
  const map = { active:'ok', connected:'ok', ended:'ok', suspended:'warn', banned:'bad', ringing:'info', declined:'warn', missed:'warn', failed:'bad', deleted:'bad' };
  return '<span class="pill ' + (map[status] || '') + '">' + h(status) + '</span>';
}
function toast(message, kind){
  const box = document.createElement('div');
  box.className = kind || '';
  box.textContent = message;
  $('#toast').appendChild(box);
  setTimeout(() => box.remove(), 4200);
}
function passwordField(id, label, options){
  options = options || {};
  var autocomplete = options.autocomplete || 'current-password';
  var min = options.min ? ' minlength="' + options.min + '"' : '';
  var placeholder = options.placeholder ? ' placeholder="' + h(options.placeholder) + '"' : '';
  return '<label class="field"><span>' + h(label) + '</span><span class="password-field">' +
    '<input class="input" id="' + h(id) + '" type="password" autocomplete="' + h(autocomplete) + '"' + min + ' maxlength="128"' + placeholder + ' required>' +
    '<button class="password-toggle" type="button" data-password-toggle="' + h(id) + '" aria-label="Show password">Show</button>' +
    '</span></label>';
}
function passwordMismatch(passwordId, confirmId, errorBox){
  var password = $('#' + passwordId), confirm = $('#' + confirmId);
  if (!password || !confirm) return false;
  if (password.value === confirm.value) return false;
  errorBox.textContent = 'Passwords do not match.';
  errorBox.style.display = 'block';
  confirm.focus();
  return true;
}
function bindAuthActions(){
  document.addEventListener('click', async event => {
    var toggle = event.target.closest('[data-password-toggle]');
    if (toggle) {
      var input = document.getElementById(toggle.dataset.passwordToggle);
      if (!input) return;
      var showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      toggle.textContent = showing ? 'Show' : 'Hide';
      toggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
      return;
    }
    var copy = event.target.closest('[data-copy-target]');
    if (copy) {
      var target = document.getElementById(copy.dataset.copyTarget);
      if (!target) return;
      try { await navigator.clipboard.writeText(target.textContent.trim()); toast('Token copied', 'ok'); }
      catch (_) { toast('Select and copy the token manually', 'bad'); }
    }
  });
}
function setTheme(theme){
  document.documentElement.dataset.theme = theme;
  try { localStorage.setItem('nexchat_admin_theme', theme); } catch (_) {}
}
function initTheme(){
  let theme = 'dark';
  try { theme = localStorage.getItem('nexchat_admin_theme') || 'dark'; } catch (_) {}
  setTheme(theme === 'light' ? 'light' : 'dark');
}
async function api(path, options){
  options = options || {};
  const method = (options.method || 'GET').toUpperCase();
  const headers = Object.assign({ accept:'application/json' }, options.headers || {});
  if (options.body !== undefined) headers['content-type'] = 'application/json';
  if (state.csrf && method !== 'GET' && method !== 'HEAD') headers['x-admin-csrf'] = state.csrf;
  const response = await fetch(path, {
    method, headers, credentials:'same-origin',
    body: options.body !== undefined ? JSON.stringify(options.body) : undefined
  });
  const text = await response.text();
  let data = {};
  try { data = text ? JSON.parse(text) : {}; } catch (_) { data = { raw:text }; }
  if (response.status === 401 && !options.allow401) {
    state.admin = null; state.csrf = null;
    showLogin('Your session expired. Sign in again.');
    throw new Error('Session expired');
  }
  if (!response.ok) {
    const message = data && data.error && data.error.message ? data.error.message : 'Request failed (' + response.status + ')';
    throw new Error(message);
  }
  return data;
}

function showFatal(message){
  $('#app').innerHTML = '<div class="boot"><div style="max-width:520px;text-align:center"><div class="error-box">' + h(message) + '</div><button class="btn primary" id="fatal-retry">Retry</button></div></div>';
  $('#fatal-retry').addEventListener('click', () => location.reload());
}
async function boot(){
  initTheme();
  bindAuthActions();
  try {
    const response = await fetch('/v1/admin/bootstrap', { credentials:'same-origin' });
    const data = await response.json();
    state.boot = data;
    const path = location.pathname.replace(/\/+$/, '');
    if (path === '/admin/forgot') return showForgot();
    if (data.setupRequired) return showSetup(data);
    const me = await fetch('/v1/admin/auth/me', { credentials:'same-origin' });
    if (me.status === 200) {
      const session = await me.json();
      state.admin = session.admin; state.csrf = session.csrfToken;
      return showApp();
    }
    showLogin();
  } catch (error) {
    showFatal('Could not reach the NEXCHAT relay: ' + error.message);
  }
}
function showLogin(message){
  state.admin = null; state.csrf = null; state.reset = null;
  var rememberDefault = false;
  try { rememberDefault = localStorage.getItem('nexchat_admin_remember') === 'true'; } catch (_) {}
  var sessionHours = state.boot && state.boot.sessionHours ? state.boot.sessionHours : 12;
  var rememberDays = state.boot && state.boot.rememberDays ? state.boot.rememberDays : 30;
  authShell('Welcome back', 'Sign in with your administrator email address and password.',
    (message ? '<div class="error-box">' + h(message) + '</div>' : '') +
    '<form id="login-form">' +
      '<label class="field"><span>Email address</span><input class="input" id="login-email" type="text" inputmode="email" autocomplete="username" required maxlength="254" placeholder="you@example.com"></label>' +
      passwordField('login-password', 'Password', { autocomplete:'current-password' }) +
      '<label class="check auth-remember"><input type="checkbox" id="login-remember"' + (rememberDefault ? ' checked' : '') + '><span><b>Remember me</b><small>Keep this browser signed in for ' + h(rememberDays) + ' days.</small></span></label>' +
      '<div class="error-box" id="login-error" style="display:none"></div>' +
      '<button class="btn primary" id="login-submit" type="submit">Sign In</button>' +
    '</form>' +
    '<div class="auth-links">' +
      '<button type="button" id="login-forgot">Forgot password?</button>' +
    '</div>' +
    '<p class="tiny" style="margin-top:14px">Sessions expire after ' + h(sessionHours) + ' hours' + (rememberDays ? ' or ' + h(rememberDays) + ' days with Remember me' : '') + ' and are bound to an HttpOnly, SameSite cookie.</p>'
  );
  $('#login-forgot').addEventListener('click', () => { location.href = '/admin/forgot'; });
  $('#login-form').addEventListener('submit', async event => {
    event.preventDefault();
    var button = $('#login-submit'), errorBox = $('#login-error');
    var remember = $('#login-remember').checked;
    errorBox.style.display = 'none'; button.disabled = true; button.textContent = 'Signing in…';
    try {
      var data = await api('/v1/admin/auth/login', {
        method:'POST', allow401:true,
        body: {
          email: $('#login-email').value.trim(),
          password: $('#login-password').value,
          remember: remember
        }
      });
      try { localStorage.setItem('nexchat_admin_remember', String(remember)); } catch (_) {}
      state.admin = data.admin; state.csrf = data.csrfToken;
      location.hash = '#/overview';
      showApp();
    } catch (error) {
      errorBox.textContent = error.message; errorBox.style.display = 'block';
      button.disabled = false; button.textContent = 'Sign In';
    }
  });
}
function showSetup(bootstrap){
  if (!bootstrap.setupEnabled) {
    authShell('Setup is locked', 'The relay is refusing first-run setup until a bootstrap secret is configured.',
      '<div class="notice warn"><b>ADMIN_SETUP_TOKEN is not configured.</b><br>Add a long random value as an <span class="mono">ADMIN_SETUP_TOKEN</span> environment variable in the Vercel project, redeploy, then reload this page.</div>' +
      '<p class="tiny">If an administrator already exists, setup stays closed permanently. Use the existing account, or recover it with Forgot password and the setup token.</p>'
    );
    return;
  }
  authShell('Create the first super admin', 'This page works once. Choose a full name, email address and password.',
    '<form id="setup-form">' +
      '<label class="field"><span>One-time setup token</span><input class="input" id="setup-token" type="password" autocomplete="off" required></label>' +
      '<label class="field"><span>Full name</span><input class="input" id="setup-name" type="text" autocomplete="name" required maxlength="60" placeholder="Your name"></label>' +
      '<label class="field"><span>Email address</span><input class="input" id="setup-email" type="email" autocomplete="username" required maxlength="254" placeholder="you@example.com"></label>' +
      passwordField('setup-password', 'Password (12+ characters)', { autocomplete:'new-password', min:12 }) +
      passwordField('setup-confirm', 'Confirm password', { autocomplete:'new-password', min:12 }) +
      '<div class="error-box" id="setup-error" style="display:none"></div>' +
      '<button class="btn primary" id="setup-submit" type="submit">Create Account</button>' +
    '</form>'
  );
  $('#setup-form').addEventListener('submit', async event => {
    event.preventDefault();
    var button = $('#setup-submit'), errorBox = $('#setup-error');
    errorBox.style.display = 'none';
    if (passwordMismatch('setup-password', 'setup-confirm', errorBox)) return;
    button.disabled = true; button.textContent = 'Creating…';
    try {
      await api('/v1/admin/setup', {
        method:'POST',
        headers:{ 'x-setup-token': $('#setup-token').value.trim() },
        body: {
          displayName: $('#setup-name').value.trim(),
          email: $('#setup-email').value.trim(),
          password: $('#setup-password').value,
          confirmPassword: $('#setup-confirm').value
        }
      });
      authShell('Administrator created', 'Sign in with the email address and password you just chose.',
        '<div class="notice ok">Your account is ready. Sign in to continue.</div>' +
        '<button class="btn primary" id="setup-continue" style="margin-top:14px">Go to sign in</button>'
      );
      $('#setup-continue').addEventListener('click', () => showLogin());
    } catch (error) {
      errorBox.textContent = error.message; errorBox.style.display = 'block';
      button.disabled = false; button.textContent = 'Create Account';
    }
  });
}

const TITLES = {
  overview:['Overview','Live operational picture'],
  users:['Users','Accounts, devices and sessions'],
  calls:['Calls','WebRTC call sessions and outcomes'],
  monitoring:['Monitoring','Crashes, failed calls and service health'],
  config:['Remote configuration','Feature flags that synchronise with Android'],

async function renderRoute(){
  if (!state.admin) return;
  const route = (location.hash.replace('#/','').split('?')[0] || 'overview');
  if (!TITLES[route]) { location.hash = '#/overview'; return; }
  state.route = route;
  const meta = TITLES[route];
  shell(meta[0], meta[1], '<div class="page-loading"><span class="spinner"></span>Loading…</div>');
  document.body.classList.remove('nav-open');
  try {
    if (route === 'overview') await overviewView();
    else if (route === 'users') await usersView();
    else if (route === 'calls') await callsView();
    else if (route === 'monitoring') await monitoringView();
    else if (route === 'config') await configView();
    else if (route === 'announcements') await announcementsView();
    else if (route === 'audit') await auditView();
    else if (route === 'admins') await adminsView();
    else if (route === 'account') await accountView();
  } catch (error) {
    const main = $('#main');
    if (main) main.innerHTML = '<div class="error-box">' + h(error.message) + '</div>';
  }

function card(label, value, sub, extra){
  return '<div class="card"><div class="label">' + h(label) + '</div><div class="value">' + value + '</div><div class="sub">' + (sub || '') + (extra || '') + '</div></div>';
}
function barChart(series, className){
  const width = 640, height = 190, padX = 28, padTop = 12, padBottom = 26;
  const max = Math.max(1, ...series.map(point => Number(point.value) || 0));
  const innerW = width - padX*2, innerH = height - padTop - padBottom;
  const step = innerW / Math.max(1, series.length);
  const barW = Math.max(2, step * 0.64);
  const labelEvery = Math.max(1, Math.ceil(series.length / 7));
  let bars = '', labels = '', grid = '';
  for (let g = 0; g <= 4; g++) {
    const y = padTop + (innerH / 4) * g;
    grid += '<line class="grid-line" x1="' + padX + '" y1="' + y.toFixed(1) + '" x2="' + (width-padX) + '" y2="' + y.toFixed(1) + '"/>';
  }
  series.forEach((point, index) => {
    const value = Number(point.value) || 0;
    const barH = (value / max) * innerH;
    const x = padX + index*step + (step-barW)/2;
    const y = padTop + innerH - barH;
    bars += '<rect class="bar ' + (className || '') + '" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + Math.max(1,barH).toFixed(1) + '" rx="3"><title>' + h(point.date) + ': ' + fmtNum(value) + '</title></rect>';
    if (index % labelEvery === 0) labels += '<text x="' + (padX + index*step + step/2).toFixed(1) + '" y="' + (height-6) + '" text-anchor="middle">' + h(fmtDay(point.date)) + '</text>';
  });
  return '<svg class="chart" viewBox="0 0 ' + width + ' ' + height + '" role="img" aria-label="Bar chart">' + grid + bars + labels + '</svg>';
}
function lineChart(series, altSeries, className){
  const width = 640, height = 190, padX = 28, padTop = 12, padBottom = 26;
  const all = series.concat(altSeries || []);
  const max = Math.max(1, ...all.map(point => Number(point.value) || 0));
  const innerW = width - padX*2, innerH = height - padTop - padBottom;
  const xAt = index => padX + index * (innerW / Math.max(1, series.length - 1));
  const yAt = value => padTop + innerH - ((Number(value) || 0) / max) * innerH;
  let grid = '';
  for (let g = 0; g <= 4; g++) {
    const y = padTop + (innerH / 4) * g;
    grid += '<line class="grid-line" x1="' + padX + '" y1="' + y.toFixed(1) + '" x2="' + (width-padX) + '" y2="' + y.toFixed(1) + '"/>';
  }
  function pathFor(points){
    return points.map((point, index) => (index ? 'L' : 'M') + xAt(index).toFixed(1) + ',' + yAt(point.value).toFixed(1)).join(' ');
  }
  const mainPath = pathFor(series);
  const area = mainPath + ' L ' + xAt(series.length-1).toFixed(1) + ',' + (padTop+innerH) + ' L ' + padX + ',' + (padTop+innerH) + ' Z';
  const altPath = altSeries && altSeries.length ? pathFor(altSeries) : '';
  const labelEvery = Math.max(1, Math.ceil(series.length / 7));
  let labels = '';
  series.forEach((point, index) => {
    if (index % labelEvery === 0) labels += '<text x="' + xAt(index).toFixed(1) + '" y="' + (height-6) + '" text-anchor="middle">' + h(fmtDay(point.date)) + '</text>';
  });
  const dots = series.map((point, index) => '<circle class="dot" cx="' + xAt(index).toFixed(1) + '" cy="' + yAt(point.value).toFixed(1) + '" r="2"><title>' + h(point.date) + ': ' + fmtNum(point.value) + '</title></circle>').join('');
  return '<svg class="chart" viewBox="0 0 ' + width + ' ' + height + '" role="img" aria-label="Line chart">' + grid +
    '<path class="area" d="' + area + '"/><path class="line ' + (className || '') + '" d="' + mainPath + '"/>' +
    (altPath ? '<path class="line alt" d="' + altPath + '"/>' : '') + dots + labels + '</svg>';
}
function barList(rows, valueKey, labelKey, color){
  const max = Math.max(1, ...rows.map(row => Number(row[valueKey]) || 0));
  if (!rows.length) return '<div class="empty">No data yet</div>';
  return '<div class="bar-list">' + rows.map(row => {
    const value = Number(row[valueKey]) || 0;
    return '<div class="bar-row"><span class="muted">' + h(row[labelKey] || 'unknown') + '</span><span class="bar-track"><span class="bar-fill ' + (color || '') + '" style="width:' + ((value/max)*100).toFixed(1) + '%"></span></span><b>' + fmtNum(value) + '</b></div>';
  }).join('') + '</div>';
}

async function loadUsers(page){

async function openUser(id){
  openModal('<div class="page-loading"><span class="spinner"></span>Loading account…</div>');
  try {
    const data = await api('/v1/admin/users/' + encodeURIComponent(id));
    const user = data.user;
    const actionButtons = [];
    if (user.status === 'active' || user.status === 'suspended') {
      actionButtons.push('<button class="btn danger" data-user-action="suspend">Suspend account</button>');
    }
    if (user.status === 'suspended' || user.status === 'deleted') {
      actionButtons.push('<button class="btn" data-user-action="restore">Reactivate account</button>');
    }
    if (user.status === 'banned') {
      actionButtons.push('<button class="btn" data-user-action="unban">Lift ban</button>');
    } else if (user.status !== 'deleted') {
      actionButtons.push('<button class="btn danger" data-user-action="ban">Ban account</button>');
    }
    if (user.status !== 'deleted') {
      actionButtons.push('<button class="btn danger" data-user-action="delete">Soft-delete</button>');
    }
    const actions = can('users.write') && actionButtons.length
      ? '<div class="row" style="margin-top:14px">' + actionButtons.join('') + '</div>'
      : '';
    $('#modal-root').innerHTML = '<div class="modal-backdrop"><div class="modal"><div class="modal-head"><div><h3>' + h(user.displayName || user.username) + '</h3><div class="tiny">@' + h(user.username) + ' · <span class="mono">' + h(user.nexId) + '</span></div></div><button class="icon-btn close" data-close>×</button></div>' +
      '<div class="grid cards" style="margin-bottom:14px">' + card('Status', statusPill(user.status), '') + card('Devices', fmtNum(data.counts ? user.deviceCount : 0), 'registered') + card('Messages (retained)', fmtNum(data.counts.sent + data.counts.received), fmtNum(data.counts.sent) + ' sent') + card('Calls', fmtNum(data.counts.calls), fmtNum(data.counts.crashes) + ' crashes') + '</div>' +
      '<h3 style="margin-top:16px">Devices</h3><div class="table-wrap"><table><thead><tr><th>Name</th><th>Platform</th><th>Signal ID</th><th>Last seen</th></tr></thead><tbody>' +
      data.devices.map(device => '<tr><td>' + h(device.name) + '</td><td>' + h(device.platform) + '</td><td>' + fmtNum(device.signalDeviceId) + '</td><td>' + h(fmtAt(device.lastSeenAt)) + '</td></tr>').join('') +
      '</tbody></table></div>' +
      '<h3 style="margin-top:16px">Recent calls</h3>' + (data.calls.length ? callsTable(data.calls) : '<div class="empty">No calls recorded.</div>') +
      '<h3 style="margin-top:16px">Recent crashes</h3>' + (data.crashes.length ? '<div class="stack">' + data.crashes.map(crash => '<div class="notice"><b>' + h(crash.appVersion || 'unknown version') + '</b> · ' + h(fmtAt(crash.createdAt)) + '<br>' + h(crash.message) + '</div>').join('') + '</div>' : '<div class="empty">No crashes recorded.</div>') +
      actions + '</div></div>';
    bindModalClose();
    $$('[data-user-action]').forEach(button => button.addEventListener('click', () => userAction(user, button.dataset.userAction)));
  } catch (error) {
    $('#modal-root').innerHTML = '<div class="modal-backdrop"><div class="modal"><div class="error-box">' + h(error.message) + '</div><button class="btn" data-close>Close</button></div></div>';
    bindModalClose();
  }

  main.innerHTML =
    '<div class="grid two"><section class="panel"><h2>' + (edit ? 'Edit announcement' : 'New announcement') + '</h2><p class="hint">The most recent active announcement is returned by <span class="mono">/v1/config</span>.</p>' +
      '<form id="announcement-form">' +
        '<label class="field"><span>Title</span><input class="input" id="ann-title" maxlength="120" required value="' + h(edit ? edit.title : '') + '" ' + (!writable ? 'disabled' : '') + '></label>' +
        '<label class="field"><span>Message</span><textarea id="ann-body" maxlength="2000" required ' + (!writable ? 'disabled' : '') + '>' + h(edit ? edit.body : '') + '</textarea></label>' +
        '<div class="row"><label class="field" style="flex:1"><span>Severity</span><select id="ann-severity" ' + (!writable ? 'disabled' : '') + '><option value="info">Information</option><option value="warning">Warning</option><option value="critical">Critical</option></select></label>' +
        '<label class="field" style="flex:1"><span>Ends at (optional)</span><input class="input" id="ann-ends" type="datetime-local" ' + (!writable ? 'disabled' : '') + '></label></div>' +
        '<label class="check"><input type="checkbox" id="ann-active" checked ' + (!writable ? 'disabled' : '') + '><span><b>Active</b><small>Only active announcements are delivered to clients.</small></span></label>' +
        '<div class="row">' + (writable ? '<button class="btn primary" type="submit">' + (edit ? 'Save changes' : 'Publish announcement') + '</button>' : '') + (edit ? '<button class="btn" type="button" id="ann-cancel">Cancel</button>' : '') + '</div>' +
      '</form></section>' +
      '<section class="panel"><h2>Published announcements</h2><p class="hint">' + fmtNum(data.announcements.length) + ' total</p>' +
        (data.announcements.length ? '<div class="stack">' + data.announcements.map(item =>
          '<div class="notice ' + (item.severity === 'critical' ? 'bad' : item.severity === 'warning' ? 'warn' : '') + '"><div class="row"><b>' + h(item.title) + '</b><span class="pill ' + (item.active ? 'ok' : '') + '">' + (item.active ? 'active' : 'inactive') + '</span><span class="grow"></span>' +
          (writable ? '<button class="btn small" data-ann-edit="' + h(item.id) + '">Edit</button><button class="btn small danger" data-ann-delete="' + h(item.id) + '">Delete</button>' : '') + '</div><div style="margin-top:6px">' + h(item.body) + '</div><div class="tiny" style="margin-top:6px">' + h(item.severity) + ' · starts ' + h(fmtAt(item.startsAt)) + (item.endsAt ? ' · ends ' + h(fmtAt(item.endsAt)) : '') + '</div></div>'
        ).join('') + '</div>' : '<div class="empty">No announcements yet.</div>') +
      '</section></div>';
  if (edit) $('#ann-severity').value = edit.severity;
  if (edit && edit.endsAt) {
    const date = new Date(edit.endsAt);
    if (!Number.isNaN(date.getTime())) $('#ann-ends').value = new Date(date.getTime() - date.getTimezoneOffset()*60000).toISOString().slice(0,16);
  }
  if (writable) {
    $('#announcement-form').addEventListener('submit', async event => {
      event.preventDefault();
      const payload = {
        title: $('#ann-title').value.trim(), body: $('#ann-body').value.trim(),
        severity: $('#ann-severity').value, active: $('#ann-active').checked,
        endsAt: $('#ann-ends').value ? new Date($('#ann-ends').value).toISOString() : null
      };
      try {
        if (edit) await api('/v1/admin/announcements/' + encodeURIComponent(edit.id), { method:'PATCH', body:payload });
        else await api('/v1/admin/announcements', { method:'POST', body:payload });
        state.editingAnnouncement = null; toast('Announcement saved', 'ok'); await announcementsView();
      } catch (error) { toast(error.message, 'bad'); }
    });
    const cancel = $('#ann-cancel');
    if (cancel) cancel.addEventListener('click', () => { state.editingAnnouncement = null; announcementsView(); });
    $$('[data-ann-edit]').forEach(button => button.addEventListener('click', () => { state.editingAnnouncement = data.announcements.find(item => item.id === button.dataset.annEdit); announcementsView(); }));
    $$('[data-ann-delete]').forEach(button => button.addEventListener('click', async () => {
      if (!window.confirm('Delete this announcement permanently?')) return;
      try { await api('/v1/admin/announcements/' + encodeURIComponent(button.dataset.annDelete), { method:'DELETE' }); toast('Announcement deleted', 'ok'); await announcementsView(); }
      catch (error) { toast(error.message, 'bad'); }
    }));
  }
}
async function auditView(){
  const data = await api('/v1/admin/audit?range=' + encodeURIComponent(state.range) + '&page=' + state.auditPage + '&pageSize=25&action=' + encodeURIComponent(state.auditAction));
  const main = $('#main');
  main.innerHTML = '<div class="toolbar"><input class="input" id="audit-action" placeholder="Filter action prefix, e.g. user." value="' + h(state.auditAction) + '" style="min-width:260px">' +
    (can('reports.export') ? '<a class="btn ghost" href="/v1/admin/reports/audit/export.csv?range=' + encodeURIComponent(state.range) + '">Export CSV</a>' : '') + '</div>' +
    '<section class="panel">' + (data.logs.length ? '<div class="table-wrap"><table><thead><tr><th>When</th><th>Administrator</th><th>Action</th><th>Target</th><th>IP</th></tr></thead><tbody>' +
      data.logs.map(log => '<tr><td>' + h(fmtAt(log.createdAt)) + '</td><td>' + h(log.adminUsername) + '</td><td class="mono">' + h(log.action) + '</td><td>' + h(log.targetType || '—') + (log.targetId ? ' <span class="tiny mono">' + h(String(log.targetId).slice(0,16)) + '</span>' : '') + '</td><td class="tiny">' + h(log.ip || '—') + '</td></tr>').join('') +
      '</tbody></table></div>' : '<div class="empty">No audit entries in this range.</div>') +
      '<div class="pager"><span>Page ' + data.page + ' of ' + data.pages + ' · ' + fmtNum(data.total) + ' entries</span><span class="row"><button class="btn small" id="audit-prev" ' + (data.page <= 1 ? 'disabled' : '') + '>Previous</button><button class="btn small" id="audit-next" ' + (data.page >= data.pages ? 'disabled' : '') + '>Next</button></span></div>' +
    '</section>';
  $('#audit-action').addEventListener('keydown', event => { if (event.key === 'Enter') { state.auditAction = event.target.value.trim(); state.auditPage = 1; auditView(); } });
  $('#audit-prev').addEventListener('click', () => { state.auditPage = Math.max(1, state.auditPage-1); auditView(); });
  $('#audit-next').addEventListener('click', () => { state.auditPage += 1; auditView(); });
}
async function adminsView(){
  const data = await api('/v1/admin/admins');
  const main = $('#main');
  main.innerHTML = '<div class="grid two"><section class="panel"><h2>Administrators</h2><p class="hint">Super admin privileges are required to manage access.</p>' +
    '<div class="table-wrap"><table><thead><tr><th>Account</th><th>Role</th><th>Status</th><th>Last login</th><th></th></tr></thead><tbody>' +
    data.admins.map(admin => '<tr><td><div class="name">' + h(admin.displayName) + '</div><div class="tiny">' + h(admin.email || admin.username) + '</div></td>' +
      '<td>' + h(admin.role) + '</td><td>' + statusPill(admin.active ? 'active' : 'suspended') + '</td><td>' + h(fmtAt(admin.lastLoginAt)) + '</td>' +
      '<td class="row"><button class="btn small ' + (admin.active ? 'danger' : '') + '" data-toggle-admin="' + h(admin.id) + '" data-active="' + (admin.active ? '1' : '0') + '">' + (admin.active ? 'Disable' : 'Enable') + '</button>' +
      (admin.id !== state.admin.id ? '<button class="btn small danger" data-delete-admin="' + h(admin.id) + '" data-admin-name="' + h(admin.username) + '">Delete</button>' : '') +
      '</td></tr>').join('') +
    '</tbody></table></div></section>' +
    '<section class="panel"><h2>Add administrator</h2><p class="hint">Only super admins can create additional administrators.</p><form id="admin-form">' +
      '<label class="field"><span>Full name</span><input class="input" id="adm-name" type="text" required maxlength="60" autocomplete="name" placeholder="Full name"></label>' +
      '<label class="field"><span>Email address</span><input class="input" id="adm-email" type="email" required maxlength="254" placeholder="you@example.com"></label>' +
      passwordField('adm-password', 'Password (12+ characters)', { autocomplete:'new-password', min:12 }) +
      passwordField('adm-confirm', 'Confirm password', { autocomplete:'new-password', min:12 }) +
      '<label class="field"><span>Role</span><select id="adm-role"><option value="admin">Admin — operations</option><option value="support">Support — user assistance</option><option value="analyst">Analyst — read-only</option><option value="super_admin">Super admin — full control</option></select></label>' +
      '<div class="error-box" id="adm-error" style="display:none"></div>' +
      '<button class="btn primary" type="submit">Create administrator</button></form></section>' +
    '<section class="panel"><h2>Access control</h2><p class="hint">There is no public administrator signup. New accounts require an authenticated super admin session, a valid CSRF token, and an explicit role.</p>' +
      '<div class="notice ok">First-run setup closes permanently after the first administrator. Lost access is recovered through Forgot password with the setup token, not by self-registration.</div>' +
    '</section></div>';
  $('#admin-form').addEventListener('submit', async event => {
    event.preventDefault();
    var errorBox = $('#adm-error');
    errorBox.style.display = 'none';
    if (passwordMismatch('adm-password', 'adm-confirm', errorBox)) return;
    try {
      const created = await api('/v1/admin/admins', { method:'POST', body:{
        displayName: $('#adm-name').value.trim(),
        email: $('#adm-email').value.trim(),
        password: $('#adm-password').value,
        confirmPassword: $('#adm-confirm').value,
        role: $('#adm-role').value
      }});
      openModal('<div class="modal-head"><div><h3>Administrator created</h3><p class="hint">' + h(created.email) + ' can now sign in with the password you set.</p></div><button class="icon-btn close" data-close>×</button></div>' +
        '<button class="btn primary" data-close>Done</button>');
      bindModalClose(); toast('Administrator created', 'ok'); await adminsView();
    } catch (error) { errorBox.textContent = error.message; errorBox.style.display = 'block'; }
  });
  $$('[data-toggle-admin]').forEach(button => button.addEventListener('click', async () => {
    const active = button.dataset.active === '1';
    if (!window.confirm((active ? 'Disable' : 'Enable') + ' this administrator?')) return;
    try {
      await api('/v1/admin/admins/' + encodeURIComponent(button.dataset.toggleAdmin), { method:'PATCH', body:{ active:!active } });
      toast('Administrator updated', 'ok'); await adminsView();
    } catch (error) { toast(error.message, 'bad'); }
  }));
  $$('[data-delete-admin]').forEach(button => button.addEventListener('click', async () => {
    if (!window.confirm('Delete @' + button.dataset.adminName + ' permanently? Their sessions are removed.')) return;
    try {
      await api('/v1/admin/admins/' + encodeURIComponent(button.dataset.deleteAdmin), { method:'DELETE' });
      toast('Administrator deleted', 'ok'); await adminsView();
    } catch (error) { toast(error.message, 'bad'); }
  }));
}
async function accountView(){
  const sessions = await api('/v1/admin/sessions');
  const main = $('#main');
  main.innerHTML = '<div class="grid two"><section class="panel"><h2>Change password</h2><p class="hint">Requires your current password. Other sessions are revoked.</p><form id="password-form">' +
    passwordField('pwd-current', 'Current password', { autocomplete:'current-password' }) +
    passwordField('pwd-new', 'New password (12+ characters)', { autocomplete:'new-password', min:12 }) +
    passwordField('pwd-confirm', 'Confirm new password', { autocomplete:'new-password', min:12 }) +
    '<div class="error-box" id="pwd-error" style="display:none"></div>' +
    '<button class="btn primary" type="submit">Update password</button></form></section>' +
    '<section class="panel"><h2>Active sessions</h2><p class="hint">Sessions are HttpOnly cookies bound to this browser.</p><div class="stack">' +
      sessions.sessions.map(session => '<div class="notice"><div class="row"><b>' + (session.current ? 'This session' : 'Session') + '</b><span class="grow"></span>' + (session.current ? '<span class="pill ok">current</span>' : '<button class="btn small danger" data-revoke="' + h(session.id) + '">Revoke</button>') + '</div><div class="tiny">Created ' + h(fmtAt(session.createdAt)) + ' · expires ' + h(fmtAt(session.expiresAt)) + '<br>' + h(session.userAgent || 'unknown browser') + ' · ' + h(session.ip || 'unknown IP') + '</div></div>').join('') +
    '</div></section></div>';
  $('#password-form').addEventListener('submit', async event => {
    event.preventDefault();
    var errorBox = $('#pwd-error');
    errorBox.style.display = 'none';
    if (passwordMismatch('pwd-new', 'pwd-confirm', errorBox)) return;
    try {
      await api('/v1/admin/auth/password', { method:'POST', allow401:true, body:{
        currentPassword: $('#pwd-current').value,
        newPassword: $('#pwd-new').value,
        confirmPassword: $('#pwd-confirm').value
      }});
      toast('Password updated. Other sessions revoked.', 'ok'); await accountView();
    } catch (error) { errorBox.textContent = error.message; errorBox.style.display = 'block'; }
  });
  $$('[data-revoke]').forEach(button => button.addEventListener('click', async () => {
    try { await api('/v1/admin/sessions/' + encodeURIComponent(button.dataset.revoke), { method:'DELETE' }); toast('Session revoked', 'ok'); await accountView(); }
    catch (error) { toast(error.message, 'bad'); }
  }));
}
function openModal(html){
  $('#modal-root').innerHTML = '<div class="modal-backdrop"><div class="modal">' + html + '</div></div>';
  bindModalClose();
}
function closeModal(){ $('#modal-root').innerHTML = ''; }
function bindModalClose(){
  $$('[data-close]').forEach(button => button.addEventListener('click', closeModal));
  const backdrop = $('#modal-root .modal-backdrop');
  if (backdrop) backdrop.addEventListener('click', event => { if (event.target === backdrop) closeModal(); });
}
document.addEventListener('keydown', event => { if (event.key === 'Escape') closeModal(); });
boot();
</script>
</body>
</html>
